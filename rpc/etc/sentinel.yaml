Name: sentinel.rpc
ListenOn: 0.0.0.0:8080

Mode: dev  # 开发环境模式，禁用服务发现

Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: ""  # Redis密码
  Tls: false

CommandTimeout: 100  # Redis命令超时时间(毫秒)

# --- 动态配额（规范 §5 / 工作包 P3）---
# QuotaRefreshInterval：仅「定时全量 Refresh」周期（秒），与 Apollo/Nacos 无关。
# 默认值 5；设为 0 时进程内按 5 处理（见 rpc/cmd/sentinel-rpc/main.go）。
# 规则变更生效延迟上界 ≈ QuotaRefreshInterval + 单次 Refresh 的 Redis 耗时（通常毫秒级）。
QuotaRefreshInterval: 5

L1Cache:
  Enabled: true     # 启用本地缓存
  TTL: 500         # 本地缓存TTL(毫秒)

Prometheus: true    # 启用Prometheus指标收集
Telemetry:
  Name: sentinel.rpc
  Endpoint: 0.0.0.0:4000
  Path: /metrics
