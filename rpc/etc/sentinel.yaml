Name: sentinel.rpc
ListenOn: 0.0.0.0:8080

Mode: dev  # 开发环境模式，禁用服务发现

Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: ""  # Redis密码
  Tls: false

CommandTimeout: 100  # Redis命令超时时间(毫秒)

# 配额规则热更：启动全量加载 + 周期刷新（秒）
QuotaRefreshInterval: 5

L1Cache:
  Enabled: true     # 启用本地缓存
  TTL: 500         # 本地缓存TTL(毫秒)

Prometheus: true    # 启用Prometheus指标收集
Telemetry:
  Name: sentinel.rpc
  Endpoint: 0.0.0.0:4000
  Path: /metrics
